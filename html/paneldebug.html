<!DOCTYPE html>
<html>
<head>
    <title>Panel Debug</title>
    <link href="panel.css" type="text/css" rel="stylesheet" />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #message-log { 
            width: 100%; 
            height: 300px; 
            border: 1px solid #ccc; 
            padding: 10px; 
            overflow-y: scroll;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }
        #command-input { 
            width: 70%; 
            padding: 8px; 
            margin-right: 10px;
        }
        button { 
            padding: 8px 15px; 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            cursor: pointer;
        }
        button:hover { background-color: #45A049; }
        .sent { color: blue; }
        .received { color: green; }
        .error { color: red; }
        .command-buttons { margin-bottom: 20px; }
        .flex {
            display: flex;
            flex-direction: row;
            align-items: start;
            justify-content: center;
        }
        .col-controls {
            width: 30%;
            border-right: 1px solid #ccc;
            padding-right: 20px;
        }
        .col-panel {
            width: 60ex;
        }
    </style>
</head>
<body>
    <div class="flex">
        <div class="col-controls">

            <h1>Panel Debug Interface</h1>
            
            <div class="command-buttons">
                <button onclick="sendProcessStatusUpdate()">Send ProcessStatusUpdate</button>
                <button onclick="sendUpdatePanelData()">Send UpdatePanelData</button>
                <button onclick="sendUisettings()">Send uisettings</button>
                <button onclick="clearLog()">Clear Log</button>
            </div>
            
            <div>
                <input type="text" id="command-input" placeholder="Enter command JSON (e.g., {\"command\":\"TriggerRefresh\"})">
                <button onclick="sendCustomCommand()">Send Custom Command</button>
            </div>
            
            <h2>Message Log:</h2>
            <div id="message-log"></div>

        </div>

        <div class="col-panel">
            <div id="panel"></div>
        </div>

    </div>
    
    <script>
        // Debug channel implementation
        const messageLog = document.getElementById('message-log');
        
        function logMessage(message, type = 'received') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = type;
            logEntry.textContent = `[${timestamp}] ${type.toUpperCase()}: ${JSON.stringify(message, null, 2)}`;
            messageLog.appendChild(logEntry);
            messageLog.scrollTop = messageLog.scrollHeight;
        }
       
        window.chrome = window.chrome || {};
        window.chrome.runtime = {};
        window.chrome.runtime.connect = () => {
            return {
                onMessage: {
                    addListener: () => {}
                },
                postMessage: (data) => logMessage(data, 'received'),
            }
        };
        
        // Simulate receiving messages from host
        function simulateHostMessage(message) {
            logMessage(message, 'received');
            
            if (message.command === 'ProcessStatusUpdate' || message.command === 'UpdatePanelData') {
                showAndUpdatePanelContent(message.data || {});
            } else if (message.command === 'uisettings') {
                setupUISettings(message.data || {});
            }
        }
        
        // Predefined test messages
        function sendProcessStatusUpdate() {
            simulateHostMessage({
                command: 'ProcessStatusUpdate',
                data: {
                    message: 'Test status update',
                    hosts: [
                        {
                            name: 'test-host',
                            status: 'UP',
                            checkresult: 'Host is up and running',
                            services: [
                                {
                                    name: 'HTTP Service',
                                    status: 'OK',
                                    checkresult: 'HTTP service is OK',
                                    servicelink: 'http://example.com'
                                }
                            ]
                        }
                    ],
                    totalhosts: 1,
                    filteredHostup: 1,
                    filteredHosterrors: 0,
                    totalservices: 1,
                    filteredServiceok: 1,
                    filteredServicewarnings: 0,
                    filteredServiceerrors: 0,
                    updatetime: '2023-01-01 12:00:00'
                }
            });
        }
        
        function sendUpdatePanelData() {
            simulateHostMessage({
                command: 'UpdatePanelData',
                data: {
                    message: 'Test update panel data',
                    hosts: [
                        {
                            name: 'test-host-2',
                            status: 'DOWN',
                            checkresult: 'Host is down',
                            services: [
                                {
                                    name: 'SSH Service',
                                    status: 'CRIT',
                                    checkresult: 'SSH service is critical',
                                    servicelink: 'ssh://example.com'
                                }
                            ]
                        }
                    ],
                    totalhosts: 1,
                    filteredHostup: 0,
                    filteredHosterrors: 1,
                    totalservices: 1,
                    filteredServiceok: 0,
                    filteredServicewarnings: 0,
                    filteredServiceerrors: 1,
                    updatetime: '2023-01-01 12:05:00'
                }
            });
        }
        
        function sendUisettings() {
            simulateHostMessage({
                command: 'uisettings',
                data: {
                    fontsize: 120,
                    inlineresults: true
                }
            });
        }
        
        function sendCustomCommand() {
            const input = document.getElementById('command-input');
            try {
                const message = JSON.parse(input.value);
                simulateHostMessage(message);
                input.value = '';
            } catch (e) {
                logMessage({error: 'Invalid JSON', message: input.value}, 'error');
            }
        }
        
        function clearLog() {
            messageLog.innerHTML = '';
        }
        
        // Initialize with a test message
        window.onload = function() {
            logMessage({message: 'Panel debug interface initialized'}, 'received');
        };
    </script>
    <script src="panel.js"></script>
</body>
</html>
