<!DOCTYPE html>
<html>
<head>
    <title>Panel Debug</title>
    <link href="panel.css" type="text/css" rel="stylesheet" />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #message-log { 
            width: 100%; 
            height: 300px; 
            border: 1px solid #ccc; 
            padding: 10px; 
            overflow-y: scroll;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }
        #command-input { 
            width: 70%; 
            padding: 8px; 
            margin-right: 10px;
        }
        button { 
            padding: 8px 15px; 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            cursor: pointer;
        }
        button:hover { background-color: #45A049; }
        .sent { color: blue; }
        .received { color: green; }
        .error { color: red; }
        .command-buttons { margin-bottom: 20px; }
        .flex {
            display: flex;
            flex-direction: row;
            align-items: start;
            justify-content: center;
        }
        .col-controls {
            width: 30%;
            border-right: 1px solid #ccc;
            padding-right: 20px;
        }
        .col-panel {
            width: 60ex;
        }
    </style>
</head>
<body>
    <div class="flex">
        <div class="col-controls">

            <h1>Panel Debug Interface</h1>
            
            <div class="command-buttons">
                <button onclick="sendUpSet()">Send UP set</button>
                <button onclick="sendErrorSet()">Send ERROR set</button>
                <button onclick="clearLog()">Clear Log</button>
            </div>
            
            <div>
                <input type="text" id="command-input" placeholder="Enter command JSON (e.g., {\"command\":\"TriggerRefresh\"})">
                <button onclick="sendCustomCommand()">Send Custom Command</button>
            </div>
            <h2>Test Cases:</h2>
            <ul id="test-cases"></ul>
            
            <h2>Message Log:</h2>
            <div id="message-log"></div>

        </div>

        <div class="col-panel">
            <div id="panel"></div>
        </div>

    </div>
    
<script src="paneldebug.js"></script>
    <script src="panel.js"></script>
</body>
</html>
